# Cloudflare Pages Configuration
# For Astro SSR with @astrojs/cloudflare adapter

name = "zeno-browser"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# ============================================
# BINDINGS - Configure in Cloudflare Dashboard
# ============================================
# Go to: https://dash.cloudflare.com/pages → zeno-browser → Settings → Functions
#
# Add these bindings manually:
# 1. KV Namespace: SESSION → select existing KV
# 2. D1 Database: DB → select zeno-browser-db
# 3. Workers AI: enable and set binding name to AI
#
# Note: Pages deployed via CLI doesn't support bindings in wrangler.toml
# They must be configured through the Dashboard UI

# ============================================
# ENVIRONMENT VARIABLES
# ============================================
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
TRANSLATION_MODEL = "@cf/meta/m2m100-1.2b"

# ============================================
# NOTES
# ============================================
# 
# To use these bindings in Astro:
# 
# // In any .astro file:
# const { SESSION, DB, AI } = Astro.locals.runtime.env;
# 
# // Example - Session KV:
# await SESSION.get("user_session");
# await SESSION.put("user_session", "data", { expirationTtl: 3600 });
# 
# // Example - D1 Database:
# const result = await DB.prepare("SELECT * FROM users WHERE id = ?").bind(userId).first();
# 
# // Example - Translation (M2M100):
# const translated = await AI.run("@cf/meta/m2m100-1.2b", {
#   text: "Hello, how are you?",
#   source_lang: "en",  // english
#   target_lang: "pl"   // polish
# });
# // Output: { translated_text: "Cześć, jak się masz?" }
#
# // Supported languages:
# // en (English), pl (Polish), de (German), es (Spanish), fr (French),
# // it (Italian), pt (Portuguese), ru (Russian), ja (Japanese), zh (Chinese),
# // ko (Korean), ar (Arabic), hi (Hindi), tr (Turkish), nl (Dutch), sv (Swedish)
# // + 80 more languages
#
# // Example - Chat AI (Llama):
# const response = await AI.run("@cf/meta/llama-2-7b-chat-int8", {
#   prompt: "Hello world"
# });
