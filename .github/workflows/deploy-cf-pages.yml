name: Deploy to Cloudflare Pages

on:
  workflow_run:
    workflows: ["Tests & Quality"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ZENO Browser
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install dependencies (ZENO_WEB_CORE_APP)
        working-directory: ZENO_WEB_CORE_APP
        run: npm ci

      - name: Build Astro (ZENO_WEB_CORE_APP)
        working-directory: ZENO_WEB_CORE_APP
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy ZENO_WEB_CORE_APP/dist --project-name=zen-bro-wser-org --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
