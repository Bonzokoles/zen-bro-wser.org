name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy ZENO Browser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: ./ZENO_WEB_CORE_APP
        run: npm ci
      - name: Build application
        working-directory: ./ZENO_WEB_CORE_APP
        run: npm run build
        env:
          NODE_ENV: production
          VITE_ENVIRONMENT: production
          VITE_API_URL: https://zeno-browser-api.stolarnia-ams.workers.dev
          VITE_CONTACT_EMAIL: JimBoZen@proton.me
          VITE_HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VITE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: ./ZENO_WEB_CORE_APP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3.90.0 pages deploy dist \
            --project-name=zeno-browser \
            --branch=main \
            --commit-dirty=true

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend: https://zeno-browser.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "✅ Worker API: https://zeno-browser-api.stolarnia-ams.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "✅ Custom Domain: https://zenbrowsers.org (pending DNS)" >> $GITHUB_STEP_SUMMARY
