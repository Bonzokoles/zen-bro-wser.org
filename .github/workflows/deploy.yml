name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - retro-90s-edition
  pull_request:
    branches:
      - main
      - retro-90s-edition
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to deploy (optional)"
        required: false
        default: ""

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    name: Deploy ZENO Browser Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (frontend)
        working-directory: ./ZENO_WEB_CORE_APP
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build application
        working-directory: ./ZENO_WEB_CORE_APP
        run: npm run build
        env:
          NODE_ENV: production
          VITE_ENVIRONMENT: production
          VITE_API_URL: https://zeno-browser-api.stolarnia-ams.workers.dev
          VITE_BIELIK_API_URL: https://zeno-bielik-agents.stolarnia-ams.workers.dev
          VITE_CONTACT_EMAIL: JimBoZen@proton.me
          VITE_HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VITE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy to Cloudflare Pages
        working-directory: ./ZENO_WEB_CORE_APP
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_BRANCH: ${{ inputs.target_branch != '' && inputs.target_branch || github.ref_name }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=zeno-browser \
            --branch=${{ env.DEPLOY_BRANCH }} \
            --commit-dirty=true

  deploy-api-worker:
    runs-on: ubuntu-latest
    name: Deploy API Worker
    needs: deploy-frontend # Deploy API after frontend is ready

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy API Worker to Cloudflare
        working-directory: ./.cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler@latest deploy \
            --config=wrangler.toml \
            --compatibility-date=2024-11-01

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Frontend: https://zeno-browser.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "✅ Worker API: https://zeno-browser-api.stolarnia-ams.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "✅ Custom Domain: https://zenbrowsers.org" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 Test API: https://zeno-browser-api.stolarnia-ams.workers.dev/health" >> $GITHUB_STEP_SUMMARY
