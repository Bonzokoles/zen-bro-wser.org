name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "DOCUMENTS_ALL/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install and build Docusaurus
        run: |
          if [ -d "website" ]; then
            cd website
            npm ci
            npm run build
          else
            echo "No website directory found, skipping Docusaurus build"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
        if: success()

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
