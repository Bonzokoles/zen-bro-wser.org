# Docker Compose configuration for ZENO Browser
# Lightweight AI models for terminal support and command processing:
# - Gemma 2B (Google, Polish support, lightweight)
# - Phi-3 Nano (Microsoft, 0.5B, ultra-lightweight)

services:
  # Gemma 2B Model (lightweight for terminal support only)
  gemma-light:
    image: google/gemma:2b
    container_name: zeno-gemma-2b
    ports:
      - "11434:8080"
    environment:
      GEMMA_LANG: pl
      MODEL_SIZE: 2b
      USE_CASE: terminal_support
    volumes:
      - gemma_data:/app/data
    restart: unless-stopped

  # Phi-3 Nano Model (ultra-lightweight 0.5B for basic tasks)
  phi-nano:
    image: mcr.microsoft.com/phi-3:nano
    container_name: zeno-phi-nano
    ports:
      - "11435:8080"
    environment:
      PHI_LANG: pl
      MODEL_SIZE: nano
      USE_CASE: terminal_support
    volumes:
      - phi_data:/app/data
    restart: unless-stopped

volumes:
  gemma_data:
    driver: local
  phi_data:
