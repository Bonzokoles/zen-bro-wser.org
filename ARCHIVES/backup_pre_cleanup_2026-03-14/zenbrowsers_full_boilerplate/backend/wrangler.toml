name = "zeno-browser-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

# Production environment
[env.production]
routes = [
  { pattern = "api.zeno-browser.com/*", zone_name = "zeno-browser.com" }
]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "zeno-browser-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"  # wrangler d1 create zeno-browser-db

# KV Cache binding
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_YOUR_KV_ID"  # wrangler kv:namespace create CACHE
preview_id = "REPLACE_WITH_YOUR_KV_PREVIEW_ID"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"

# Secrets (use: wrangler secret put SECRET_NAME)
# - GEMINI_API_KEY
# - OPENAI_API_KEY
# - ANTHROPIC_API_KEY
# - TAVILY_API_KEY
