# Cloudflare Workers Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration

name = "zeno-browser-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Account details (replace with your own)
account_id = "7f490d58a478c6baccb0ae01ea1d87c3"  # Get from: wrangler whoami
workers_dev = true  # Use workers.dev subdomain for testing

# Routes for production (uncomment when ready)
# [env.production]
# name = "zeno-browser-api-production"
# routes = [
#   { pattern = "api.your-domain.com/*", zone_name = "your-domain.com" }
# ]

# D1 Database binding
[[d1_databases]]
binding = "DB"  # Available as env.DB in code
database_name = "zeno-browser-db"
database_id = "dc8c73b9-1e19-411c-a447-109e68fd9568"  # FILL THIS: Run 'wrangler d1 create zeno-browser-db' and paste ID here

# Preview database for development
# [[d1_databases]]
# binding = "DB"
# database_name = "zeno-browser-db-preview"
# database_id = ""  # FILL THIS: Run 'wrangler d1 create zeno-browser-db-preview'
# preview_database_id = ""

# KV Namespace for caching
[[kv_namespaces]]
binding = "CACHE"  # Available as env.CACHE in code
id = "cce469bb54d142ebbbce4287e450daec"  # FILL THIS: Run 'wrangler kv:namespace create CACHE' and paste ID here
preview_id = "139be3a08d7940eea1de297b0ac22e59"  # FILL THIS: Run 'wrangler kv:namespace create CACHE --preview' and paste ID here

# Durable Objects (optional - for real-time features)
# [[durable_objects.bindings]]
# name = "SESSIONS"
# class_name = "SessionManager"
# script_name = "zeno-browser-api"

# R2 Storage (optional - for file uploads)
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "zeno-uploads"
# preview_bucket_name = "zeno-uploads-preview"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
ALLOWED_ORIGINS = "*"  # Change to your domain in production
CACHE_TTL = "300"  # 5 minutes
MAX_PAGE_SIZE = "100"
STRIPE_PRICE_MONTHLY = "price_1SPy7sRtD21KYuw9U9XFnLRz"
STRIPE_PRICE_YEARLY = "price_1SPy7tRtD21KYuw93Vs5849G"

# Observability settings
[observability]
enabled = true
head_sampling_rate = 1.0  # Sample 100% of requests (reduce in production)

# Limits and performance
# [limits]
# cpu_ms = 50  # Max CPU time per request
# 
# [placement]
# mode = "smart"  # Automatic optimal placement

# Development server settings
[dev]
ip = "0.0.0.0"
port = 8787
local_protocol = "http"
upstream_protocol = "https"

# Secrets (use 'wrangler secret put <NAME>' to set these)
# DO NOT commit actual secret values to Git!
# 
# Required secrets:
# - GEMINI_API_KEY: Google Gemini API key
# - OPENAI_API_KEY: OpenAI API key
# - ANTHROPIC_API_KEY: Anthropic Claude API key
# - TAVILY_API_KEY: Tavily search API key (optional)
# - STRIPE_SECRET_KEY: Stripe secret key (sk_test_... or sk_live_...)
# - STRIPE_WEBHOOK_SECRET: Stripe webhook signing secret (whsec_...)
# 
# Set secrets with:
# wrangler secret put GEMINI_API_KEY
# wrangler secret put OPENAI_API_KEY
# wrangler secret put ANTHROPIC_API_KEY
# wrangler secret put TAVILY_API_KEY
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SECRET

# Triggers (cron jobs)
# [triggers]
# crons = ["0 0 * * *"]  # Daily at midnight UTC

# Analytics Engine (optional)
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"

# Queues (optional - for background processing)
# [[queues.producers]]
# binding = "MY_QUEUE"
# queue = "my-queue"
# 
# [[queues.consumers]]
# queue = "my-queue"
# max_batch_size = 10
# max_batch_timeout = 30
# max_retries = 3

# Hyperdrive (optional - for database connections)
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = ""

# Vectorize (optional - for AI embeddings)
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "zeno-embeddings"

# Browser Rendering (optional - for screenshots)
# [browser]
# binding = "BROWSER"

# AI (for Cloudflare AI models)
[ai]
binding = "AI"

# Service bindings (optional - call other workers)
# [[services]]
# binding = "AUTH_SERVICE"
# service = "zeno-auth-worker"
# environment = "production"

# Tail consumers (optional - for log processing)
# [[tail_consumers]]
# service = "zeno-log-processor"

# Unsafe bindings (use with caution)
# [[unsafe.bindings]]
# name = "MY_EVAL"
# type = "eval"

# ============================================
# PRODUCTION ENVIRONMENT
# ============================================

[env.production]
name = "zeno-browser-api-production"
vars = { ENVIRONMENT = "production", ALLOWED_ORIGINS = "https://zeno-browser.pages.dev" }

# Production D1 Database
[[env.production.d1_databases]]
binding = "DB"
database_name = "zeno-browser-db-prod"
database_id = ""  # FILL THIS: Create separate production database

# Production KV
[[env.production.kv_namespaces]]
binding = "CACHE"
id = ""  # FILL THIS: Create separate production KV namespace

# Production routes
[[env.production.routes]]
pattern = "api.zeno-browser.com/*"
zone_name = "zeno-browser.com"  # Replace with your domain

# ============================================
# STAGING ENVIRONMENT
# ============================================

[env.staging]
name = "zeno-browser-api-staging"
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "*" }

# Staging D1 Database
[[env.staging.d1_databases]]
binding = "DB"
database_name = "zeno-browser-db-staging"
database_id = ""  # FILL THIS

# Staging KV
[[env.staging.kv_namespaces]]
binding = "CACHE"
id = ""  # FILL THIS

# ============================================
# NOTES
# ============================================

# 1. Setup Steps:
#    a) Run: wrangler login
#    b) Run: wrangler d1 create zeno-browser-db
#    c) Run: wrangler kv:namespace create CACHE
#    d) Fill in the IDs above
#    e) Run: wrangler d1 execute zeno-browser-db --file=./schema.sql
#    f) Set secrets: wrangler secret put GEMINI_API_KEY
#    g) Deploy: wrangler deploy

# 2. Local Development:
#    - Run: wrangler dev
#    - Access: http://localhost:8787
#    - Uses remote D1/KV by default (add --local for local)

# 3. Database Migrations:
#    - Create: wrangler d1 migrations create zeno-browser-db <migration_name>
#    - Apply: wrangler d1 migrations apply zeno-browser-db
#    - List: wrangler d1 migrations list zeno-browser-db

# 4. Monitoring:
#    - Logs: wrangler tail
#    - Metrics: https://dash.cloudflare.com/workers
#    - Analytics: https://dash.cloudflare.com/analytics

# 5. Deployment:
#    - Staging: wrangler deploy --env staging
#    - Production: wrangler deploy --env production
#    - Rollback: wrangler rollback --message "Reason"

# 6. Useful Commands:
#    - wrangler dev --remote          # Dev with remote resources
#    - wrangler d1 execute DB --file  # Run SQL
#    - wrangler kv:key list --binding # List KV keys
#    - wrangler secret list           # List secrets
#    - wrangler deployments list      # List deployments
