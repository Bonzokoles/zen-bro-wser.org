[[env.notifications-ws.migrations]]
tag = "v1"
new_sqlite_classes = ["NotificationManager"]

[[env.notifications-ws.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.notifications-ws.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"
