# Główna konfiguracja wrangler dla wszystkich gateway i websockets
# zen-bro-wser.org infrastructure

account_id = "7f490d58a478c6baccb0ae01ea1d87c3"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ============================================
# LOCAL GATEWAYS
# ============================================

# API Gateway - główny endpoint REST API
[env.api-gateway]
name = "zen-api-gateway"
main = "local/api-gateway.ts"
workers_dev = true

# Routing production - odkomentuj gdy domena będzie gotowa
# [[env.api-gateway.routes]]
# pattern = "api.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.api-gateway.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.api-gateway.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"

# Static Gateway - CDN dla plików statycznych
[env.static-gateway]
name = "zen-static-gateway"
main = "local/static-gateway.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "static.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.static-gateway.r2_buckets]]
binding = "STATIC_ASSETS"
bucket_name = "zen-static-assets"
preview_bucket_name = "zen-static-assets-preview"

[[env.static-gateway.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

# Auth Gateway - autentykacja i autoryzacja
[env.auth-gateway]
name = "zen-auth-gateway"
main = "local/auth-gateway.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "auth.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.auth-gateway.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.auth-gateway.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"

[env.auth-gateway.vars]
JWT_SECRET = "super-secret-jwt-key-change-this-in-production-min-32-characters-required"

# Metrics Gateway - analytics i monitoring
[env.metrics-gateway]
name = "zen-metrics-gateway"
main = "local/metrics-gateway.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "metrics.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.metrics-gateway.analytics_engine_datasets]]
binding = "METRICS"

[[env.metrics-gateway.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.metrics-gateway.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"

# ============================================
# AI GATEWAYS
# ============================================

# DeepSeek AI Gateway
[env.deepseek-gateway]
name = "zen-deepseek-gateway"
main = "ai/deepseek-gateway.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "ai.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.deepseek-gateway.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[env.deepseek-gateway.vars]
OPENROUTER_API_KEY = "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"
DEEPSEEK_API_KEY = ""

# MCP Gateway
[env.mcp-gateway]
name = "zen-mcp-gateway"
main = "ai/mcp-gateway.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "mcp.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.mcp-gateway.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.mcp-gateway.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"

[env.mcp-gateway.vars]
MCP_API_BASE = "http://localhost:8001"  # FastAPI Gateway URL

# RAG Gateway
[env.rag-gateway]
name = "zen-rag-gateway"
main = "ai/rag-gateway.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "rag.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.rag-gateway.vectorize]]
binding = "VECTORIZE"
index_name = "zen-rag-index"

[[env.rag-gateway.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.rag-gateway.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"

[env.rag-gateway.vars]
OPENROUTER_API_KEY = "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"

# ============================================
# WEBSOCKETS
# ============================================

# Chat WebSocket
[env.chat-ws]
name = "zen-chat-ws"
main = "../websockets/chat-ws.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "chat.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.chat-ws.durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[env.chat-ws.migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[env.chat-ws.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.chat-ws.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"

