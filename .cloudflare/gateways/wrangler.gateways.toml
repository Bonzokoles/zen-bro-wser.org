new_sqlite_classes = ["CollabDocument"]

[[env.collab-ws.kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"

[[env.collab-ws.d1_databases]]
binding = "DB"
database_name = "zen-browser-db"
database_id = "c1fd4ebf-9619-47f8-b8c3-21b084278909"

# Notifications WebSocket
[env.notifications-ws]
name = "zen-notifications-ws"
main = "../websockets/notifications-ws.ts"
workers_dev = true

# [[env.$1.routes]]
# pattern = "notifications.zen-bro-wser.org/*"
# zone_name = "zen-bro-wser.org"

[[env.notifications-ws.durable_objects.bindings]]
