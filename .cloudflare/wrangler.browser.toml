# Browser Rendering Worker Configuration
# Uses Cloudflare Browser Rendering API (official, ToS compliant)

name = "zeno-browser-rendering"
main = "browser-worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

account_id = "7f490d58a478c6baccb0ae01ea1d87c3"
workers_dev = true

# Browser Rendering binding
browser = { binding = "BROWSER" }

# KV for caching
[[kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"
preview_id = "139be3a08d7940eea1de297b0ac22e59"

# Environment variables
[vars]
CACHE_TTL = "300"
MAX_TIMEOUT = "30000"

# Limits
[limits]
cpu_ms = 50000  # Browser rendering needs more CPU time
