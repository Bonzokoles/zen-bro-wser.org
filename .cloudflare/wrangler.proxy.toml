# Cloudflare Worker - Iframe Proxy
# Dedicated worker for proxying websites to bypass X-Frame-Options

name = "zeno-iframe-proxy"
main = "proxy-worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

account_id = "7f490d58a478c6baccb0ae01ea1d87c3"
workers_dev = true

# KV for caching proxied content
[[kv_namespaces]]
binding = "CACHE"
id = "cce469bb54d142ebbbce4287e450daec"
preview_id = "139be3a08d7940eea1de297b0ac22e59"

# Environment variables
[vars]
MAX_CACHE_SIZE = "5242880"  # 5MB per item
CACHE_TTL = "300"  # 5 minutes
ALLOWED_DOMAINS = "*"  # Restrict in production

# Rate limiting
[limits]
cpu_ms = 50  # Max 50ms CPU time per request
