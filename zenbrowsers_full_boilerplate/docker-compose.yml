version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: zenbrowsers
      POSTGRES_PASSWORD: example
      POSTGRES_DB: zenbrowsersdb
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://zenbrowsers:example@postgres:5432/zenbrowsersdb
    ports:
      - 5000:5000
  frontend:
    build: ./frontend
    ports:
      - 3000:5173
volumes:
  pgdata:
